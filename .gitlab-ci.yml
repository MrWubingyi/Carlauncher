stages: [native, review, build, performance]

default:
  image: carlauncher-android-ci:local
  tags: [carlauncher-docker]
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  auto_cancel:
    on_new_commit: interruptible

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
  NATIVE_BUILD_JOBS: '2'
  BOOST_DOWNLOAD_URL: 'https://downloads.sourceforge.net/project/boost/boost/1.90.0/boost_1_90_0.tar.bz2'
  NATIVE_DOWNLOAD_CACHE: "$CI_PROJECT_DIR/.native-download-cache"
  GRADLE_DOWNLOAD_URL: 'https://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-bin.zip'

native-build:
  stage: native
  timeout: 2h
  cache:
    key: native-source
    when: always
    paths: [.native-download-cache/]
  script:
    - bash tools/vsomeip-android/build-source.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build/native/artifact/
      - build/native/logs/

# Goldens were rendered on Windows. Reuse the existing Windows shell runner.
ui-regression:
  stage: review
  needs: []
  tags: [carlauncher-device]
  resource_group: aaos-simpleperf-device
  timeout: 45m
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - python -m pip install Pillow==12.3.0
    - python tools/visual-regression/test_ci.py
    - python tools/visual-regression/run_ci.py
  artifacts:
    when: always
    expire_in: 14 days
    expose_as: 'UI screenshot regression'
    paths:
      - build/ui-regression/ci/
    reports:
      junit: build/ui-regression/ci/*/junit/TEST-*.xml

code-review:
  stage: review
  needs:
    - job: native-build
      artifacts: true
  timeout: 1h
  cache:
    key: android-gradle
    when: always
    paths: [.gradle-ci/caches/, .gradle-ci/wrapper/]
  script:
    - bash tools/gitlab/prepare-gradle.sh
    - bash tools/gitlab/run-review.sh
  artifacts:
    when: always
    expire_in: 14 days
    expose_as: 'Code review reports'
    paths:
      - build/reports/code-review/
      - app/build/reports/checkstyle/
      - someip-android/build/reports/checkstyle/
      - app/build/reports/detekt/
      - someip-android/build/reports/detekt/
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml
      - app/build/reports/lint-results-debug.sarif
      - someip-android/build/reports/lint-results-debug.html
      - someip-android/build/reports/lint-results-debug.xml
      - someip-android/build/reports/lint-results-debug.sarif
    reports:
      codequality: build/reports/code-review/codequality.json
      junit: build/reports/code-review/junit.xml
      annotations: build/reports/code-review/annotations.json

android-build:
  stage: build
  needs:
    - job: native-build
      artifacts: true
    - job: code-review
      artifacts: false
  timeout: 2h
  cache:
    key: android-gradle
    when: always
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  script:
    - bash tools/gitlab/prepare-gradle.sh
    - bash ./gradlew --no-daemon --max-workers=2 --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest :someip-android:assembleDebug :someip-android:testDebugUnitTest :app:assembleProfiling :app:lintProfiling
    - python3 tools/vsomeip-android/verify-artifact.py --apk app/build/outputs/apk/debug/app-debug.apk
    - bash ./gradlew --no-daemon --stacktrace :app:fullDebugUnitTestCoverageReport
    - bash tools/gitlab/run-jmh.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/profiling/*.apk
      - someip-android/build/outputs/aar/*.aar
      - someip-android/build/intermediates/cxx/RelWithDebInfo/**/obj/x86_64/*.so
      - app/build/reports/tests/testDebugUnitTest/
      - app/build/test-results/testDebugUnitTest/
      - app/build/reports/jacoco/fullDebugUnitTestCoverageReport/
      - someip-android/build/reports/tests/testDebugUnitTest/
      - someip-android/build/test-results/testDebugUnitTest/
      - app/build/reports/jmh/
      - build/reports/jvm-performance/
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/TEST-*.xml
        - someip-android/build/test-results/testDebugUnitTest/TEST-*.xml
        - build/reports/jvm-performance/junit.xml
      coverage_report:
        coverage_format: jacoco
        path: app/build/reports/jacoco/fullDebugUnitTestCoverageReport/fullDebugUnitTestCoverageReport.xml
      annotations: build/reports/jvm-performance/annotations.json

simpleperf:
  stage: performance
  tags: [carlauncher-device]
  resource_group: aaos-simpleperf-device
  interruptible: false
  needs:
    - job: android-build
      artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_CLONE_PATH: '$CI_BUILDS_DIR/carlauncher'
    PERF_SERIAL: emulator-5554
  allow_failure: false
  timeout: 20m
  script:
    - ./tools/gitlab/run-simpleperf.ps1
  artifacts:
    when: always
    expire_in: 14 days
    expose_as: 'Android simpleperf reports'
    paths:
      - build/reports/simpleperf/
    reports:
      junit: build/reports/simpleperf/gitlab/junit.xml
      annotations: build/reports/simpleperf/gitlab/annotations.json
