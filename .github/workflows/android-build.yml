name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-regression:
    name: Windows screenshot regression
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install screenshot dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          exit $LASTEXITCODE
      - name: Verify goldens and generate Chinese report
        run: python tools/visual-regression/run_ci.py
      - name: Test screenshot report failure handling
        if: ${{ always() }}
        run: python tools/visual-regression/test_ci.py
      - name: Upload screenshot reports including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-ui-regression-${{ github.run_number }}
          path: build/ui-regression/ci/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Debug APK and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/cli/latest/linux_x86_64/install.sh \
            --output "$RUNNER_TEMP/install-android-cli.sh"
          bash "$RUNNER_TEMP/install-android-cli.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/android" --version

          sdk_root="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          mkdir -p "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Install Android build dependencies with Android CLI
        shell: bash
        run: |
          android --sdk="$ANDROID_HOME" sdk install \
            platforms/android-36.1 build-tools/36.0.0 \
            ndk/28.2.13676358 cmake/3.22.1 platform-tools
          test -f "$ANDROID_HOME/platforms/android-36.1/optional/android.car.jar"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5

      - name: Build Boost and vSomeIP from pinned sources
        run: bash tools/vsomeip-android/build-source.sh

      - name: Review Kotlin and Java and run Android Lint
        run: bash tools/gitlab/run-review.sh

      - name: Build Debug and Profiling APKs and run unit tests
        run: >-
          bash ./gradlew --no-daemon --stacktrace --continue
          :app:assembleDebug :app:testDebugUnitTest
          :someip-android:assembleDebug :someip-android:testDebugUnitTest
          :app:assembleProfiling :app:lintProfiling

      - name: Check SOME/IP dependency boundaries
        shell: pwsh
        run: ./tools/check-someip-layering.ps1

      - name: Verify APK contains the source-built library
        run: >-
          python3 tools/vsomeip-android/verify-artifact.py
          --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native library and provenance
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-native-x86_64-${{ github.run_number }}
          path: build/native/artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-native-logs-${{ github.run_number }}
          path: build/native/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug and Profiling APKs
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-debug-x86_64-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/profiling/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SOME/IP library
        uses: actions/upload-artifact@v6
        with:
          name: SomeIp-android-debug-x86_64-${{ github.run_number }}
          path: someip-android/build/outputs/aar/someip-android-debug.aar
          if-no-files-found: error
          retention-days: 14

      # The existing report also scans manually collected device coverage under
      # app/build. Run it separately to avoid overlapping assemble task outputs.
      - name: Generate coverage report
        run: bash ./gradlew --no-daemon --stacktrace :app:fullDebugUnitTestCoverageReport

      - name: Publish review and test summary
        if: ${{ always() }}
        run: python3 tools/github/summarize.py

      - name: Upload test, coverage, lint, and Detekt reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-reports-${{ github.run_number }}
          path: |
            build/reports/code-review/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/jacoco/fullDebugUnitTestCoverageReport/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-profiling.*
            app/build/reports/checkstyle/
            someip-android/build/reports/checkstyle/
            app/build/reports/detekt/
            someip-android/build/reports/
            someip-android/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
