name: carlauncher-gitlab
services:
  gitlab:
    image: gitlab/gitlab-ce@sha256:b65c3ece044d125254b4c4a99b10676bbd2502f05f8c628cb60628f44f4df11b
    container_name: carlauncher-gitlab
    hostname: gitlab
    restart: unless-stopped
    shm_size: '256m'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://192.168.112.1:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2229
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
    ports:
      - '127.0.0.1:8929:8929'
      - '127.0.0.1:2229:22'
      - '192.168.112.1:8929:8929'
      - '192.168.112.1:2229:22'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
  runner:
    image: gitlab/gitlab-runner@sha256:77d03a5c881ff8f97381de4f96a66c080733eeab9c9cf502bd19916a18969113
    container_name: carlauncher-gitlab-runner
    restart: unless-stopped
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
networks:
  default:
    name: carlauncher-gitlab
