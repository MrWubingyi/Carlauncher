name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hosted Windows defaults to cp1252; report summaries include Chinese text.
  PYTHONUTF8: '1'

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt an in-flight device recording on a newer push.
  cancel-in-progress: false

jobs:
  # Use the existing baseline hosts; hosted VMs are not comparable to this baseline.
  performance-build:
    name: Baseline-host JMH and profiling payload
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [build, ui-regression]
    runs-on: [self-hosted, Linux, X64, carlauncher-docker]
    concurrency:
      group: carlauncher-jmh
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      BASELINE_GITHUB_RUNNER_NAME: ${{ vars.BASELINE_GITHUB_JMH_RUNNER_NAME }}
      GRADLE_DOWNLOAD_URL: https://mirrors.cloud.tencent.com/gradle/gradle-9.5.0-bin.zip
    outputs:
      acceptance: ${{ steps.acceptance.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: CarLauncher-native-x86_64-${{ github.run_number }}
          path: build/native/artifact/
      - name: Build profiling payload and enforce JMH in baseline Docker image
        run: bash tools/github/run-performance-build.sh
      - name: Upload profiling APK and native symbols
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-performance-inputs-${{ github.run_number }}
          path: |
            app/build/outputs/apk/profiling/app-profiling.apk
            someip-android/build/intermediates/cxx/RelWithDebInfo/**/obj/x86_64/*.so
          if-no-files-found: error
          retention-days: 14
      - name: Upload JMH reports even on failure
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-jmh-${{ github.run_number }}
          path: |
            build/reports/jvm-performance/
            app/build/reports/jmh/
          retention-days: 14

      - name: Collect acceptance evidence
        id: acceptance
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: python3 tools/github/summarize.py --kind jmh

  simpleperf:
    name: Android baseline-device simpleperf
    needs: performance-build
    runs-on: [self-hosted, Windows, X64, carlauncher-device]
    timeout-minutes: 20
    concurrency:
      group: aaos-simpleperf-device
      cancel-in-progress: false
    env:
      PERF_SERIAL: emulator-5554
      BASELINE_GITHUB_RUNNER_NAME: ${{ vars.BASELINE_GITHUB_SIMPLEPERF_RUNNER_NAME }}
    outputs:
      acceptance: ${{ steps.acceptance.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: CarLauncher-performance-inputs-${{ github.run_number }}
          path: .
      - name: Verify device and scenario, then record and enforce budget
        shell: pwsh
        run: ./tools/gitlab/run-simpleperf.ps1
      - name: Upload preflight, samples, flame graph and JUnit
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-simpleperf-${{ github.run_number }}
          path: build/reports/simpleperf/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect acceptance evidence
        id: acceptance
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: python tools/github/summarize.py --kind simpleperf

  ui-regression:
    name: Windows screenshot regression
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      acceptance: ${{ steps.acceptance.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v5
      - name: Install screenshot dependencies
        shell: pwsh
        run: |
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36.1' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          exit $LASTEXITCODE
      - name: Verify goldens and generate Chinese report
        run: python tools/visual-regression/run_ci.py
      - name: Test screenshot report failure handling
        if: ${{ always() }}
        run: python tools/visual-regression/test_ci.py
      - name: Upload screenshot reports including failures
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-ui-regression-${{ github.run_number }}
          path: build/ui-regression/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect acceptance evidence
        id: acceptance
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: python tools/github/summarize.py --kind ui

  build:
    name: Debug APK and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      acceptance: ${{ steps.acceptance.outputs.acceptance }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://dl.google.com/android/cli/latest/linux_x86_64/install.sh \
            --output "$RUNNER_TEMP/install-android-cli.sh"
          bash "$RUNNER_TEMP/install-android-cli.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/android" --version

          sdk_root="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          mkdir -p "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Install Android build dependencies with Android CLI
        shell: bash
        run: |
          android --sdk="$ANDROID_HOME" sdk install \
            platforms/android-36.1 build-tools/36.0.0 \
            ndk/28.2.13676358 cmake/3.22.1 platform-tools
          test -f "$ANDROID_HOME/platforms/android-36.1/optional/android.car.jar"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5

      - name: Build Boost and vSomeIP from pinned sources
        run: bash tools/vsomeip-android/build-source.sh

      - name: Review Kotlin and Java and run Android Lint
        run: bash tools/gitlab/run-review.sh

      - name: Build Debug and Profiling APKs and run unit tests
        run: >-
          bash ./gradlew --no-daemon --stacktrace --continue
          :app:assembleDebug :app:testDebugUnitTest
          :someip-android:assembleDebug :someip-android:testDebugUnitTest
          :app:assembleProfiling :app:lintProfiling

      - name: Check SOME/IP dependency boundaries
        shell: pwsh
        run: ./tools/check-someip-layering.ps1

      - name: Verify APK contains the source-built library
        run: >-
          python3 tools/vsomeip-android/verify-artifact.py
          --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native library and provenance
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-native-x86_64-${{ github.run_number }}
          path: build/native/artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload native build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-native-logs-${{ github.run_number }}
          path: build/native/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug and Profiling APKs
        id: apk
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-debug-x86_64-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/profiling/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SOME/IP library
        id: aar
        uses: actions/upload-artifact@v6
        with:
          name: SomeIp-android-debug-x86_64-${{ github.run_number }}
          path: someip-android/build/outputs/aar/someip-android-debug.aar
          if-no-files-found: error
          retention-days: 14

      # The existing report also scans manually collected device coverage under
      # app/build. Run it separately to avoid overlapping assemble task outputs.
      - name: Generate coverage report
        run: bash ./gradlew --no-daemon --stacktrace :app:fullDebugUnitTestCoverageReport
      - name: Upload test, coverage, lint, and Detekt reports
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: CarLauncher-reports-${{ github.run_number }}
          path: |
            build/reports/code-review/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/jacoco/fullDebugUnitTestCoverageReport/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-profiling.*
            app/build/reports/checkstyle/
            someip-android/build/reports/checkstyle/
            app/build/reports/detekt/
            someip-android/build/reports/
            someip-android/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect acceptance evidence
        id: acceptance
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          AAR_URL: ${{ steps.aar.outputs.artifact-url }}
        run: python3 tools/github/summarize.py --kind build

  acceptance-summary:
    name: 中文验收摘要
    if: ${{ always() }}
    needs: [build, ui-regression, performance-build, simpleperf]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test acceptance summary failure handling
        run: python3 tools/github/test-summarize.py
      - name: Publish Chinese acceptance summary
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/github/summarize.py --aggregate
